name: minimal_pocket_finance_app
description: "A lightweight, offline-first personal finance management application with local SQLite storage and P2P synchronization built with Flutter."
publish_to: 'none'

version: 2.2.0+6

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Database
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.5
  path: ^1.9.1
  path_provider: ^2.1.5

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^16.0.0

  # Local settings
  shared_preferences: ^2.5.3

  # Android Storage Access Framework (SAF)
  saf_util: ^3.1.0
  saf_stream: ^3.0.0

  # File and Image Attachments
  image_picker: ^1.1.2
  file_picker: ^8.1.7

  # P2P WebRTC & Encryption
  flutter_webrtc: ^0.12.1
  web_socket_channel: ^3.0.1
  qr_flutter: ^4.1.0
  crypto: ^3.0.6

  intl: ^0.20.2
  
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.0
  mobile_scanner: ^7.4.0
  uuid: ^4.6.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"

  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 256

  web:
    generate: true
    image_path: "assets/images/app_icon.png"

  macos:
    generate: true
    image_path: "assets/images/app_icon.png"

  linux:
    generate: true
    image_path: "assets/images/app_icon.png"